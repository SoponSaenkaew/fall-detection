# 1. ระบบตรวจจับการล้ม (Smart Fall Detection)
server {
    listen 80;
    server_name fall-detection.sopon-project.me;

    # สำหรับขอใบรับรองความปลอดภัยผ่าน Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # บังคับเข้าใช้งานผ่าน HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fall-detection.sopon-project.me;

    # ไฟล์ใบรับรอง SSL (จะถูกแชร์ผ่าน Volume จาก Certbot ของเครื่องโฮสต์)
    ssl_certificate /etc/letsencrypt/live/fall-detection.sopon-project.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fall-detection.sopon-project.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend Dashboard (Next.js Static ใน Nginx container)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Go API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket สำหรับรับส่งพิกัดเรียลไทม์
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

